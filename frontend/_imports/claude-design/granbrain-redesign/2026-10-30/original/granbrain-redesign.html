<meta name="claude:viewport-fit-sides" content="cover">
<title>GranBrain Redesign</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Direção: mesa de trabalho calma. Superfícies com leve viés verde-petróleo; a cor de destaque aparece só onde há uma ação.
   Tipografia: Bricolage Grotesque (títulos), IBM Plex Sans (texto), JetBrains Mono (dados, caminhos e horários).
   Layout: trilho de navegação à esquerda, painel central em grade de cartões, assistente flutuante por cima de tudo. */
:root {
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --bg: #f3f6f4;
  --surface: #ffffff;
  --surface-2: #e8eeea;
  --line: #d5dfd9;
  --line-strong: #b5c4bc;
  --fg: #13201b;
  --fg-2: #4a5c54;
  --fg-3: #6b7c74;
  --accent: #0c7766;
  --accent-hover: #09604f;
  --accent-fg: #ffffff;
  --accent-soft: #d5eee7;
  --ok: #17703a;
  --ok-soft: #d8efdf;
  --warn: #8a5a00;
  --warn-soft: #fbecc6;
  --danger: #b42318;
  --danger-soft: #fde1dc;
  --info: #3a52c8;
  --info-soft: #e0e6ff;
  --shadow: 0 1px 2px rgba(19, 32, 27, .06), 0 10px 28px rgba(19, 32, 27, .10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1210;
    --surface: #121c18;
    --surface-2: #18251f;
    --line: #23342d;
    --line-strong: #364c43;
    --fg: #e4eee9;
    --fg-2: #a7b9b0;
    --fg-3: #7f9489;
    --accent: #51d0b3;
    --accent-hover: #7fe0c9;
    --accent-fg: #052019;
    --accent-soft: #143b32;
    --ok: #6fd694;
    --ok-soft: #15331f;
    --warn: #f0c464;
    --warn-soft: #3a2e12;
    --danger: #ff8c82;
    --danger-soft: #3e1c18;
    --info: #a9b8ff;
    --info-soft: #1f2748;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .38);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1210;
  --surface: #121c18;
  --surface-2: #18251f;
  --line: #23342d;
  --line-strong: #364c43;
  --fg: #e4eee9;
  --fg-2: #a7b9b0;
  --fg-3: #7f9489;
  --accent: #51d0b3;
  --accent-hover: #7fe0c9;
  --accent-fg: #052019;
  --accent-soft: #143b32;
  --ok: #6fd694;
  --ok-soft: #15331f;
  --warn: #f0c464;
  --warn-soft: #3a2e12;
  --danger: #ff8c82;
  --danger-soft: #3e1c18;
  --info: #a9b8ff;
  --info-soft: #1f2748;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .38);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.ico { width: 18px; height: 18px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--fg-2); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.path { overflow-wrap: anywhere; }
.mt { margin-top: 16px; }
[hidden] { display: none !important; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.rail {
  position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 22px; padding: 22px 14px 18px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.logo { width: 32px; height: 32px; color: var(--accent); flex: none; }
.brand-n { display: block; font: 700 18px/1.1 var(--font-display); letter-spacing: -.01em; }
.nav { display: grid; gap: 18px; }
.nav-group { display: grid; gap: 2px; }
.nav-group .eyebrow { margin: 0 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px;
  border-radius: 10px; color: var(--fg-2); text-decoration: none; font-weight: 500; font-size: 14px;
}
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item.on { background: var(--accent-soft); color: var(--accent); }
.nav-item .wi { margin-left: auto; font-size: 10.5px; padding: 1px 6px; }
.rail-foot { margin-top: auto; padding: 0 8px; font-size: 12.5px; color: var(--fg-3); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; min-height: 60px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; }
.crumb { font-size: 14px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb strong { color: var(--fg); font-weight: 600; }
.crumb .sep { margin: 0 6px; color: var(--fg-3); }
.user-chip { display: flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
.topbar-end { display: flex; align-items: center; gap: 8px; }
.view { width: 100%; max-width: 1180px; margin: 0 auto; padding: 26px max(16px, env(safe-area-inset-right, 0px)) 130px max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }
.scrim { position: fixed; inset: 0; z-index: 54; background: rgba(5, 10, 8, .4); }
.tabbar { display: none; }

body.bare .rail, body.bare .topbar, body.bare .tabbar { display: none; }
body.bare .app { display: block; }
body.bare .view { max-width: 1100px; padding-top: 40px; }

/* ---------- Primitives ---------- */
.eyebrow { font: 500 11.5px/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.eyebrow-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { font: 700 clamp(26px, 3.2vw, 34px)/1.1 var(--font-display); letter-spacing: -.02em; margin: 8px 0 6px; text-wrap: balance; }
h2 { font: 650 17px/1.25 var(--font-display); margin: 0; letter-spacing: -.005em; }
.lede { color: var(--fg-2); max-width: 64ch; margin: 0; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 20px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; min-width: 0; }
.g-main { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); margin-top: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-periods { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--fg-2); white-space: nowrap;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.wi {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
  border: 1px dashed var(--info); color: var(--info); font: 500 11.5px/1.4 var(--font-mono); white-space: nowrap;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface);
  font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; background: var(--surface); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 40px; padding: 0; }
.btn.block { width: 100%; }
.btn.mic.live { background: var(--danger); border-color: var(--danger); color: var(--bg); animation: pulse 1s ease-in-out infinite; }
.btn .ico { width: 17px; height: 17px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--danger-soft); } }
.input {
  width: 100%; min-height: 42px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
}
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea.input { padding: 10px 12px; min-height: 84px; resize: vertical; }
.input.big-in { min-height: 50px; font-size: 16px; }
.lbl { font-size: 13px; font-weight: 500; color: var(--fg-2); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.req { color: var(--danger); }
.stack { display: grid; gap: 14px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.check-row { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.check-row input { width: 18px; height: 18px; accent-color: var(--accent); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); font-size: 13px;
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.sm { min-height: 28px; font-size: 12px; padding: 0 10px; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); }
.seg button {
  min-height: 30px; border: 0; background: transparent; border-radius: 999px; padding: 0 10px;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2);
}
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg .ico { width: 15px; height: 15px; }
.link { color: var(--accent); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.link:hover { text-decoration: underline; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.row:last-child { border-bottom: 0; }
button.row { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; font: inherit; color: inherit; }
button.row:last-child { border-bottom: 0; }
.empty { color: var(--fg-3); font-size: 14px; margin: 0; padding: 14px; border: 1px dashed var(--line-strong); border-radius: 10px; text-align: center; }
.code { margin: 0; background: var(--surface-2); border-radius: 10px; padding: 14px; font: 12.5px/1.6 var(--font-mono); white-space: pre-wrap; color: var(--fg-2); overflow-x: auto; }
.logrow { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.logrow:last-child { border-bottom: 0; }
.logrow p { margin: 0 0 2px; }
.bar { flex: 1; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font: 600 13px var(--font-display); flex: none;
}
.avatar.sm { width: 28px; height: 28px; font-size: 11px; }
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); z-index: 80; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast {
  pointer-events: auto; max-width: 380px; background: var(--fg); color: var(--bg);
  padding: 11px 14px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow);
  animation: toast-in .2s ease-out;
}
.toast.warn { background: var(--warn); color: var(--bg); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }
dialog {
  border: 1px solid var(--line-strong); border-radius: 16px; background: var(--surface); color: var(--fg);
  padding: 20px; width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(5, 10, 8, .5); }
.dlg-form { display: grid; gap: 14px; }

/* ---------- Painel ---------- */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cell { background: var(--surface); padding: 16px 18px; display: grid; gap: 8px; min-width: 0; }
.big { font: 700 30px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.warn-t { color: var(--warn); }
.counts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.counts > div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.counts strong { font: 700 22px/1 var(--font-display); }
.mini-ev { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.mini-ev:last-child { border-bottom: 0; }
.nrow { display: grid; gap: 2px; padding: 10px 12px; margin: 0 -12px; border-radius: 10px; border: 0; background: transparent; text-align: left; color: inherit; text-decoration: none; min-width: 0; }
a.nrow:hover, button.nrow:hover { background: var(--surface-2); }
.nrow.on { background: var(--accent-soft); }
.nt { font-weight: 600; overflow-wrap: anywhere; }
.nm { font-size: 12px; color: var(--fg-3); }
.habit .check {
  width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--line-strong);
  display: grid; place-items: center; flex: none; background: var(--surface); color: var(--accent-fg);
}
.habit .check .ico { width: 16px; height: 16px; }
.habit.done .check { background: var(--accent); border-color: var(--accent); }
.habit .t { color: var(--fg-3); margin-right: 4px; }
.habit .lbl-h { font-weight: 500; }
.habit.done .lbl-h { color: var(--fg-3); text-decoration: line-through; }
.ask .chips { margin-top: 4px; }
.progress-row { display: flex; align-items: center; gap: 14px; }

/* ---------- Hábitos ---------- */
.period-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.note-line { margin-top: 16px; }

/* ---------- Kanban ---------- */
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) 180px auto; gap: 10px; align-items: center; margin-top: 16px; }
.board-wrap { overflow-x: auto; margin-top: 16px; padding-bottom: 4px; min-width: 0; }
.board { display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 12px; }
.col { background: var(--surface-2); border-radius: 14px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.col-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 4px 6px; }
.col-h .mono { display: block; font-size: 11px; color: var(--fg-3); }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.kcard p { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.kcard .input { min-height: 34px; font-size: 13px; }

/* ---------- Notas ---------- */
.notes-tools { display: grid; gap: 12px; margin-top: 16px; }
.search { display: flex; align-items: center; gap: 10px; position: relative; }
.search .ico { position: absolute; left: 12px; color: var(--fg-3); pointer-events: none; }
.search .input { padding-left: 40px; }
.notes-split { display: grid; grid-template-columns: minmax(250px, .85fr) minmax(0, 1.4fr); gap: 16px; margin-top: 16px; align-items: start; }
.list { padding: 8px 14px; display: grid; gap: 2px; }
.list-h { padding: 6px 0 4px; font-size: 12px; }
.note { display: grid; gap: 12px; align-content: start; min-height: 320px; }
.note h2 { font-size: 24px; letter-spacing: -.015em; }
.note p { margin: 0; color: var(--fg-2); max-width: 68ch; }
.wl { color: var(--accent); font-weight: 500; border-bottom: 1px dashed var(--accent); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.backlinks { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
.backlinks ul { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: 14px; }

/* ---------- Captura ---------- */
.quick-form { display: flex; gap: 10px; align-items: center; }
.quick-form .input { flex: 1; min-width: 0; }
.quick-form .btn.icon { width: 50px; min-height: 50px; flex: none; }
.quick-form .btn.primary { min-height: 50px; flex: none; }
.hint { margin: 10px 2px 0; font-size: 13px; color: var(--fg-3); }
.card-quick { padding: 14px; }

/* ---------- Agente ---------- */
.prov-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.prov { display: grid; gap: 10px; align-content: start; }
.prov.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.prov .btn { justify-self: start; }

/* ---------- Ideias & Brainstorm ---------- */
.idea { display: flex; justify-content: space-between; align-items: center; gap: 14px 18px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.idea:last-child { border-bottom: 0; padding-bottom: 0; }
.idea-main { min-width: 0; flex: 1 1 260px; }
.idea-main p { margin: 0 0 4px; font-weight: 500; }
.idea-side { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.stages { display: flex; gap: 6px; flex-wrap: wrap; }
.session-h { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
.session-h h2 { font-size: 21px; margin-top: 4px; }
.board3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.hyp { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.hyp:last-child { border-bottom: 0; }
.hyp p { margin: 0; font-size: 14px; }
.socratic { display: grid; gap: 10px; margin-top: 16px; }
.socratic .q { font: 600 21px/1.3 var(--font-display); margin: 4px 0 0; color: var(--fg); max-width: 40ch; text-wrap: balance; }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- Agenda ---------- */
.conflict { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--fg); font-size: 14px; margin-top: 16px; }
.conflict .ico { color: var(--warn); margin-top: 2px; }
.timeline { display: grid; gap: 10px; margin-top: 16px; }
.ev { display: grid; grid-template-columns: 56px 14px minmax(0, 1fr); align-items: start; gap: 10px; }
.ev time { padding-top: 16px; color: var(--fg-2); }
.ev .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); margin-top: 18px; justify-self: center; }
.ev.now .dot { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
.ev.past { opacity: .55; }
.ev-card { padding: 14px 16px; display: grid; gap: 8px; }
.ev-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ev-top strong { font-weight: 600; }

const pill = (t, tone = '') => `<span class="pill ${tone}">${esc(t)}</span>`;
const wiTag = w => `<span class="wi">WI ${w}</span>`;
const provPill = p => pill(p, { Google: 'info', Teams: 'accent', Outlook: 'warn' }[p] || '');
const ideaPill = st => pill(IDEA_LABEL[st][0], IDEA_LABEL[st][1]);
function head({ eyebrow, title, lede = '', actions = '', wi = '' }) {
  return `<div class="page-head">
    <div>
      <div class="eyebrow-row"><span class="eyebrow">${eyebrow}</span>${wi ? wiTag(wi) : ''}</div>
      <h1>${title}</h1>
      ${lede ? `<p class="lede">${lede}</p>` : ''}
    </div>
    ${actions ? `<div class="head-actions">${actions}</div>` : ''}
  </div>`;
}
function evStatus(e) {
  if (toMin(e.e) <= toMin(NOW)) return { k: 'past', l: 'Passou', tone: '' };
  if (toMin(e.s) <= toMin(NOW)) return { k: 'now', l: 'Em andamento', tone: 'ok' };
  return { k: 'next', l: 'Próximo', tone: 'accent' };
}
function habitRow(h) {
  return `<button class="row habit ${h.done ? 'done' : ''}" data-act="habit" data-id="${h.id}" aria-pressed="${h.done}">
    <span class="check">${h.done ? ic('tick') : ''}</span>
    <span class="grow"><span class="mono t">${h.time}</span><span class="lbl-h">${esc(h.label)}</span></span>
    ${pill(h.done ? 'Feito' : 'Pendente', h.done ? 'ok' : '')}
  </button>`;
}
function noteMini(n) {
  return `<a class="nrow" href="#notas"><span class="nt">${esc(n.title)}</span><span class="nm mono">${n.cat} · ${n.date}</span></a>`;
}
function noteRow(n, active) {
  return `<button class="nrow ${active ? 'on' : ''}" data-act="note" data-id="${n.id}" ${active ? 'aria-current="true"' : ''}>
    <span class="nt">${esc(n.title)}</span><span class="nm mono">${n.cat} · ${n.date}</span>
  </button>`;
}

function agendaLista() {
  const list = EVENTS.filter(e => S.agProv === 'Todos' || e.p === S.agProv);
  const items = [];
  let shown = false;
  list.forEach(e => {
    if (!shown && toMin(e.s) > toMin(NOW)) { items.push(nowLine()); shown = true; }
    const st = evStatus(e);
    items.push(`<div class="ev ${st.k}">
      <time class="mono">${e.s}</time><span class="dot"></span>
      <article class="card ev-card">
        <div class="ev-top"><strong>${esc(e.t)}</strong>${pill(st.l, st.tone)}</div>
        <div class="ev-meta"><span class="mono muted">${e.s}–${e.e}</span>${provPill(e.p)}</div>
      </article>
    </div>`);
  });
  if (!shown) items.push(nowLine());
  return `
  ${head({
    eyebrow: 'Proposto',
    wi: '0003',
    title: 'Agenda',
    lede: 'Google, Teams e Outlook mesclados em ordem. As reuniões entram na nota diária sem apagar nada.',
    actions: `${agViewSeg()}<button class="btn primary" data-act="sync">${ic('calendar')}Sincronizar agora</button>`
  })}
  <div class="chips">
    ${['Todos', 'Google', 'Teams', 'Outlook'].map(p => `<button class="chip" data-act="agfilter" data-prov="${p}" aria-pressed="${S.agProv === p}">${p}</button>`).join('')}

  <section class="timeline">${items.join('')}</section>`;
};

function agViewSeg() {
  return `<div class="seg" role="group" aria-label="Visualização da agenda">${[['lista', 'Lista'], ['calendario', 'Calendário']]
    .map(([v, l]) => `<button data-act="agview" data-v="${v}" aria-pressed="${S.agView === v}">${l}</button>`).join('')}</div>`;
}
function agendaCalendario() {
  const START = 8 * 60, END = 18 * 60, PX = 60;
  const yOf = t => (toMin(t) - START) / 60 * PX;
  const blocks = EVENTS.map(e => {
    const group = EVENTS.filter(o => toMin(o.s) < toMin(e.e) && toMin(e.s) < toMin(o.e));
    const n = group.length, idx = group.indexOf(e);
    return `<div class="cal-ev p-${e.p.toLowerCase()} ${n > 1 ? 'clash' : ''}"
      style="top:${yOf(e.s)}px;height:${(toMin(e.e) - toMin(e.s)) / 60 * PX - 4}px;left:calc(${idx / n * 100}% + 3px);width:calc(${100 / n}% - 6px)">
      <strong>${esc(e.t)}</strong> <span class="mono">${e.s}</span></div>`;
  }).join('');
  const hours = [];
  for (let h = 8; h <= 18; h++) {
    hours.push(`<div class="cal-line" style="top:${(h * 60 - START) / 60 * PX}px"></div>
      <div class="cal-hour" style="top:${(h * 60 - START) / 60 * PX}px"><span class="mono">${String(h).padStart(2, '0')}:00</span></div>`);
  }
  return `
  ${head({
    eyebrow: 'Proposto',
    wi: '0003',
    title: 'Agenda',
    lede: 'Mesmos eventos, em visão de calendário. Conflitos aparecem lado a lado.',
    actions: `${agViewSeg()}<button class="btn primary" data-act="sync">${ic('calendar')}Sincronizar agora</button>`
  })}
  <div class="conflict">${ic('alert')}<span>Conflito às 15:30: <strong>Dentista</strong> se sobrepõe à <strong>Revisão de arquitetura</strong>.</span></div>
  <section class="card calwrap">
    <div class="cal-grid" style="height:${(END - START) / 60 * PX}px">
      ${hours.join('')}
      ${blocks}
      <div class="cal-now" style="top:${yOf(NOW)}px"><span>${NOW}</span></div>
    </div>
  </section>`;
}

function current() {
  const h = location.hash.slice(1);
  return SCREENS.some(s => s.id === h) ? h : 'painel';
}
function go(id) {
  if (location.hash.slice(1) === id) { render(); return; }
  location.hash = id;
}
function render() {
  const id = current();
  const s = SCREENS.find(x => x.id === id);
  document.body.classList.toggle('bare', id === 'login');
  $('#view').innerHTML = VIEWS[id]();
  HOOKS[id]?.();
  renderNav(id);
  renderTabs(id);
  $('#crumb').innerHTML = `<span>Telas</span><span class="sep">/</span><strong>${s.name}</strong>`;
  $('#logout').hidden = !S.authed;
  syncTheme();
  renderChat();
  toggleMenu(false);
}
function renderNav(id) {
  const item = s => `<a class="nav-item ${s.id === id ? 'on' : ''}" href="#${s.id}" ${s.id === id ? 'aria-current="page"' : ''}>
    ${ic(s.icon)}<span class="grow">${s.name}</span>${s.wi ? `<span class="wi">WI ${s.wi}</span>` : ''}
  </a>`;
  $('#nav').innerHTML = `
    <div class="nav-group"><span class="eyebrow">Existentes no frontend</span>${SCREENS.filter(s => s.group === 'existing').map(item).join('')}</div>
    <div class="nav-group"><span class="eyebrow">Propostas nas WIs</span>${SCREENS.filter(s => s.group === 'proposed').map(item).join('')}</div>
    <div class="nav-group"><span class="eyebrow">Sistema</span>${SCREENS.filter(s => s.group === 'system').map(item).join('')}</div>`;
}
function renderTabs(id) {
  $$('.tab[data-tab]').forEach(a => {
    const on = a.dataset.tab === id;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
function applyTheme(t) {
  S.theme = t;
  const r = document.documentElement;
  if (t === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  store.set('theme', t);
  syncTheme();
}
function syncTheme() {
  $$('[data-theme-switch]').forEach(el => {
    if (!el.childElementCount) el.innerHTML = themeSwitch();
  });
  $$('[data-act="theme"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === S.theme)));
}
function toggleMenu(force) {
  const open = force ?? !$('#rail').classList.contains('open');
  $('#rail').classList.toggle('open', open);
  $('#scrim').hidden = !open;
}

/* ============ Notas ============ */
function renderNoteList() {
  const q = S.noteQuery.trim().toLowerCase();
  const list = S.notes.filter(n =>
    (S.noteCat === 'Todas' || n.cat === S.noteCat) &&
    (!q || (n.title + ' ' + n.body.join(' ') + ' ' + n.tags.join(' ')).toLowerCase().includes(q)));
  $('#note-list').innerHTML = list.length
    ? `<div class="list-h mono muted">${list.length} ${list.length === 1 ? 'nota' : 'notas'}</div>` + list.map(n => noteRow(n, n.id === S.noteId)).join('')
    : `<div class="empty"><p style="margin:0 0 10px">Nenhuma nota para “${esc(S.noteQuery)}”.</p><a class="btn sm" href="#captura">Criar nota</a></div>`;
  const cur = list.find(n => n.id === S.noteId) || list[0];
  if (cur) S.noteId = cur.id;
  $('#note-view').innerHTML = cur
    ? `<div class="eyebrow">${cur.cat} · ${cur.date}</div>
       <h2>${esc(cur.title)}</h2>
       <div class="tags">${cur.tags.map(t => pill('#' + t)).join('')}</div>
       ${cur.body.map(p => `<p>${esc(p).replace(/\[\[(.+?)\]\]/g, '<span class="wl">$1</span>')}</p>`).join('')}
       <div class="backlinks"><span class="eyebrow">Notas que citam esta</span>
         ${cur.backs.length ? `<ul>${cur.backs.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : '<p class="small muted">Nenhuma ainda.</p>'}
       </div>`
    : '<p class="muted">Selecione uma nota.</p>';
}

/* ============ Captura ============ */
function renderCform() {
  const t = CAPTURE[S.ctype];
  $('#cform').innerHTML = `<form class="stack" data-submit="cform" novalidate>
    ${t.fields.map(f => fieldHtml(f)).join('')}
    <div class="actions"><button class="btn primary" type="submit">Criar nota no cofre</button></div>
  </form>`;
  $('#cyaml').textContent = yaml(S.ctype);
  $('#cpath').textContent = t.dir;
}
function fieldHtml(f) {
  const id = 'cf-' + f.k;
  const req = f.req ? ' required' : '';
  const label = `<label class="lbl" for="${id}">${esc(f.l)}${f.req ? ' <span class="req">*</span>' : ''}</label>`;
  let ctl;
  if (f.type === 'select') ctl = `<select class="input" id="${id}" name="${f.k}">${f.opts.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') ctl = `<textarea class="input" id="${id}" name="${f.k}" rows="3"${req}></textarea>`;
  else ctl = `<input class="input" id="${id}" name="${f.k}" type="${f.type || 'text'}"${req}>`;
  return `<div class="field">${label}${ctl}</div>`;
}
function yaml(t) {
  const m = { nota: ['nota', 'Zettelkasten'], reuniao: ['reuniao', 'Reuniões'], tarefa: ['tarefa', 'Kanban'], inbox: ['inbox', 'Inbox'] }[t];
  return `---\ntipo: ${m[0]}\ncriado: 2026-10-30\narea: ${m[1]}\ntags: [#${m[0]}]\n---`;
}
function voice(btn) {
  const input = document.getElementById(btn.dataset.target);
  if (!input || btn.getAttribute('aria-pressed') === 'true') return;
  btn.setAttribute('aria-pressed', 'true');
  btn.classList.add('live');
  setTimeout(() => {
    input.value = btn.dataset.sample || '';
    input.focus();
    btn.setAttribute('aria-pressed', 'false');
    btn.classList.remove('live');
  }, 1400);
}

/* ============ Rotinas ============ */
function triage() {
  if (S.triaging) return;
  S.triaging = true;
  render();
  setTimeout(() => {
    const n = S.inbox.length;
    S.triaging = false;
    S.inbox = [];
    S.log.unshift({ t: 'Agora', m: `InboxTriageJob: ${n} ${n === 1 ? 'arquivo triado' : 'arquivos triados'}. Originais em inbox/_archive/.` });
    toast(n ? `Inbox triado: ${n} ${n === 1 ? 'arquivo' : 'arquivos'}` : 'O inbox já estava vazio', 'ok');
    render();
  }, 1600);
}

/* ============ Captura mobile (segurar para gravar) ============ */
function startRec(el) {
  if (S.rec) return;
  S.rec = { t0: Date.now() };
  el.classList.add('live');
  $('#rec-state').textContent = 'Gravando… solte para enviar';
  try { navigator.vibrate?.(12); } catch { /* sem vibração */ }
  S.rec.timer = setInterval(() => { const t = $('#rec-time'); if (t) t.textContent = fmt(Date.now() - S.rec.t0); }, 200);
}
function stopRec() {
  if (!S.rec) return;
  clearInterval(S.rec.timer);
  const ms = Date.now() - S.rec.t0;
  S.rec = null;
  if (ms < 800) { toast('Segure por pelo menos 1 segundo.', 'warn'); render(); return; }
  S.inbox.unshift({ id: 'x' + Date.now(), name: `Áudio ${fmt(ms)}.md`, dest: 'inbox/', tag: '#mobile-capture' });
  toast('Áudio salvo no inbox com #mobile-capture', 'ok');
  render();
}

/* ============ Toast e perfis ============ */
function toast(msg, kind = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 3200);
}
function openProfile() {

/* ============ Assistente ============ */
function answer(q) {
  const t = q.toLowerCase();
  const p = PROVIDERS.find(x => x.id === S.provider);
  if (/h[aá]bito/.test(t)) return { text: 'Você concluiu 3 de 6 hábitos. Faltam: revisar o Kanban, a caminhada e a leitura.', go: { id: 'habitos', label: 'Abrir hábitos' } };
  if (/kanban|tarefa|card|bloque/.test(t)) return { text: 'No Kanban Profissional, uma tarefa está bloqueada: “Aguardar acesso ao domínio”.', go: { id: 'kanban', label: 'Abrir Kanban' } };
  if (/agenda|reuni|calend/.test(t)) return { text: 'Próximo compromisso: Revisão de arquitetura, às 15:00 (Teams). Há conflito com o dentista às 15:30.', go: { id: 'agenda', label: 'Abrir agenda' } };
  if (/ideia|fleeting|brainstorm/.test(t)) return { text: 'Há 2 ideias em Fleeting. A mais madura é o cronograma de revisão semanal.', go: { id: 'ideias', label: 'Abrir ideias' } };
  return { text: `Resposta simulada. Em produção, ${p.name} responde com base nas notas do cofre.` };
}
function renderChat() {
  $('#chat-msgs').innerHTML = S.chat.msgs.map(m => `<div class="msg ${m.from === 'me' ? 'me' : 'bot'}">${esc(m.text)}${m.go ? `<div class="msg-act"><a class="btn sm" href="#${m.go.id}">${esc(m.go.label)}</a></div>` : ''}</div>`).join('');
  $('#chat-msgs').scrollTop = 1e9;
  const cur = PROVIDERS.find(p => p.id === S.provider);
  $('#chat-prov').innerHTML = `<span class="pill accent" title="Troque a IA em Configurações">IA: ${esc(cur.model)}</span>`;
  $('#chat-sugg').innerHTML = S.chat.msgs.length <= 1 ? SUGGEST.map(q => `<button class="chip sm" data-act="chatq" data-q="${esc(q)}">${esc(q)}</button>`).join('') : '';
}
function askChat(q) {
  const text = (q || '').trim();
  if (!text) return;
  S.chat.msgs.push({ from: 'me', text });
  $('#chat-input').value = '';
  renderChat();
  setTimeout(() => {
    const r = answer(text);
    S.chat.msgs.push({ from: 'bot', text: r.text, go: r.go });
    renderChat();
  }, 450);
}

const bubble = $('#bubble');
const chat = $('#chat');
let drag = null;
let justDragged = false;

function placeBubble(x, y, save = false) {
  const w = bubble.offsetWidth, h = bubble.offsetHeight;
  const nx = clamp(x, 8, innerWidth - w - 8), ny = clamp(y, 8, innerHeight - h - 8);
  bubble.style.left = nx + 'px';
  bubble.style.top = ny + 'px';
  bubble.style.right = 'auto';
  bubble.style.bottom = 'auto';
  S.bubble = { x: nx, y: ny };
  if (save) store.set('bubble', S.bubble);
}
function placeChat() {
  const narrow = innerWidth <= 640;
  chat.classList.toggle('sheet', narrow);
  if (narrow) {
    Object.assign(chat.style, { left: '8px', right: '8px', top: '8px', bottom: '84px', width: 'auto', height: 'auto' });
    return;
  }
  const b = bubble.getBoundingClientRect(), w = 380, h = Math.min(520, innerHeight - 32);
  const fits = (x, y) => x >= 8 && y >= 8 && x + w <= innerWidth - 8 && y + h <= innerHeight - 8;
  const alignX = clamp(b.right - w, 8, innerWidth - w - 8);
  const alignY = clamp(b.bottom - h, 8, innerHeight - h - 8);
  const spots = [
    [alignX, b.top - h - 12],
    [alignX, b.bottom + 12],
    [b.left - w - 12, alignY],
    [b.right + 12, alignY]
  ];
  const [x, y] = spots.find(([sx, sy]) => fits(sx, sy)) || spots[0];
  Object.assign(chat.style, {
    left: clamp(x, 8, innerWidth - w - 8) + 'px', top: clamp(y, 8, innerHeight - h - 8) + 'px',
    width: w + 'px', height: h + 'px', right: 'auto', bottom: 'auto'
  });
}
function toggleChat(force) {
  S.chat.open = force ?? !S.chat.open;
  chat.hidden = !S.chat.open;
  bubble.setAttribute('aria-expanded', String(S.chat.open));
  bubble.setAttribute('aria-label', S.chat.open ? 'Fechar assistente' : 'Abrir assistente');
  bubble.innerHTML = ic(S.chat.open ? 'close' : 'chat');
  if (S.chat.open) {
    placeChat();
    setTimeout(() => $('#chat-input').focus(), 0);
  }
}

/* ============ Ações (delegação de eventos) ============ */
const ACT = {
  go: el => go(el.dataset.go),
  theme: el => applyTheme(el.dataset.theme),
  menu: () => toggleMenu(),
  pw: el => {
    const i = $('#l-pass');
    const show = i.type === 'password';
    i.type = show ? 'text' : 'password';
    el.innerHTML = ic(show ? 'eyeOff' : 'eye');
    el.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    el.title = show ? 'Ocultar senha' : 'Mostrar senha';
    el.setAttribute('aria-pressed', String(show));
  },
  logout: () => { S.authed = false; go('login'); },
  habit: el => {
    const h = S.habits.find(x => x.id === el.dataset.id);
    h.done = !h.done;
    render();
  },
  board: el => { S.board = el.dataset.board; render(); },
  nfilter: el => {
    S.noteCat = el.dataset.cat;
    $$('#ncats .chip').forEach(c => c.setAttribute('aria-pressed', String(c === el)));
    renderNoteList();
  },
  note: el => { S.noteId = el.dataset.id; renderNoteList(); },
  ctype: el => { S.ctype = el.dataset.type; $$('#ctypes .chip').forEach(c => c.setAttribute('aria-pressed', String(c === el))); renderCform(); },
  voice: el => voice(el),
  idea: el => {
    const i = S.ideas.find(x => x.id === el.dataset.id) || S.ideas.find(x => x.id === 'i2');
    i.status = el.dataset.to;
    toast(`Ideia marcada como ${IDEA_LABEL[i.status][0].toLowerCase()}`, 'ok');
    render();
  },
  provider: el => { S.provider = el.dataset.id; toast(`IA em uso: ${PROVIDERS.find(p => p.id === S.provider).name}`, 'ok'); render(); },
  agfilter: el => { S.agProv = el.dataset.prov; render(); },
  agview: el => { S.agView = el.dataset.v; render(); },
  sync: () => toast('Sincronizado: 5 eventos (Google 2, Teams 2, Outlook 1)', 'ok'),
  triage: () => triage(),
  mshare: el => { S.mobTab = el.dataset.tab; render(); },
  pnew: () => openProfile(),
  dlgclose: () => $('#dlg').close(),
  pedit: () => toast('Edição de perfil (simulada)'),
  chatopen: el => { toggleChat(true); if (el.dataset.q) askChat(el.dataset.q); },
  chatclose: () => toggleChat(false),
  chatq: el => askChat(el.dataset.q)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) ACT[el.dataset.act]?.(el, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const k = e.target.dataset.submit;
  if (SUB[k]) SUB[k](e.target);
});
document.addEventListener('input', e => {
  if (e.target.id === 'nsearch') { S.noteQuery = e.target.value; renderNoteList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.chg === 'kmove') {
    const c = S.cards.find(x => x.id === t.dataset.id);
    c.col = t.value;
    toast(`Card movido para ${COLLABEL[c.col]}`, 'ok');
    render();
  }
  if (t.dataset.chg === 'localfb') S.localFallback = t.checked;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.chat.open) toggleChat(false);
    if ($('#rail').classList.contains('open')) toggleMenu(false);
  }
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-hold]');
  if (el) startRec(el);
});
document.addEventListener('pointerup', stopRec);
document.addEventListener('pointercancel', stopRec);

const SUB = {
  login: f => {
    const d = Object.fromEntries(new FormData(f));
    const err = $('#l-err');
    if (!d.user.trim() || !d.pass) {
      err.hidden = false;
      err.textContent = 'Informe usuário e senha para entrar.';
      (d.user.trim() ? f.elements.pass : f.elements.user).focus();
      return;
    }
    S.authed = true;
    toast(`Sessão iniciada. Cofre de ${S.user.name}.`, 'ok');
    go('painel');
  },
  quick: f => {
    const text = new FormData(f).get('text').trim();
    if (!text) { f.elements.text.focus(); return; }
    S.inbox.unshift({ id: 'x' + Date.now(), name: text.slice(0, 40) + '.md', dest: 'inbox/', tag: '#captura' });
    toast('Enviado ao inbox', 'ok');
    render();
  },
  cform: f => {
    const t = CAPTURE[S.ctype];
    const d = Object.fromEntries(new FormData(f));
    const missing = t.fields.find(x => x.req && !(d[x.k] || '').trim());
    if (missing) {
      f.elements[missing.k].focus();
      toast(`Preencha “${missing.l}”.`, 'warn');
      return;
    }
    const title = (d.title || d.content || 'Nota').trim();
    S.notes.unshift({
      id: 'n' + Date.now(), title,
      cat: S.ctype === 'reuniao' ? 'Reuniões' : S.ctype === 'tarefa' ? 'Projetos' : S.ctype === 'nota' ? (d.area || 'Zettelkasten') : 'Zettelkasten',
      date: '2026-10-30', tags: [S.ctype], body: [d.content || d.agenda || 'Sem conteúdo.'], backs: []
    });
    if (S.ctype === 'tarefa') {
      S.cards.push({ id: 'c' + Date.now(), board: 'Profissional', col: d.col === 'Em andamento' ? 'Doing' : 'To Do', text: title });
    }
    toast(`Nota criada em ${t.dir}${title.slice(0, 30)}.md`, 'ok');
    render();
  },
  kadd: f => {
    const d = Object.fromEntries(new FormData(f));
    if (!d.text.trim()) { f.elements.text.focus(); return; }
    S.cards.push({ id: 'c' + Date.now(), board: S.board, col: d.col, text: d.text.trim() });
    toast('Tarefa adicionada ao quadro', 'ok');
    render();
  },
  idea: f => {
    const text = new FormData(f).get('text').trim();
    if (!text) { f.elements.text.focus(); return; }
    S.ideas.unshift({ id: 'i' + Date.now(), text, time: nowHM(), status: 'fleeting' });
    toast('Ideia capturada em Fleeting', 'ok');
    render();
  },
  share: f => {
    const d = Object.fromEntries(new FormData(f));
    S.inbox.unshift({ id: 'x' + Date.now(), name: 'Link: artigo RAG.md', dest: d.dest, tag: '#mobile-capture' });
    S.mobTab = 'home';
    toast('Link salvo no inbox', 'ok');
    render();
  },
  chat: f => {
    const q = new FormData(f).get('q');
    askChat(q);
  },
  pcreate: f => {
    const d = Object.fromEntries(new FormData(f));
    if (!d.name.trim() || !d.user.trim() || !d.pass) {
      toast('Preencha nome, usuário e senha inicial.', 'warn');
      return;
    }
    const initials = d.name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
    S.profiles.push({ id: 'p' + Date.now(), name: d.name.trim(), initials, user: d.user.trim(), role: d.role, vault: d.vault, notes: 0 });
    $('#dlg').close();
    toast(d.blueprint ? 'Perfil criado. Cofre pronto com blueprint, sem notas de outros perfis.' : 'Perfil criado sem blueprint.', 'ok');
    render();
  }
};

/* ============ Inicialização ============ */
bubble.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const r = bubble.getBoundingClientRect();
  drag = { id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, sx: e.clientX, sy: e.clientY, moved: false };
  justDragged = false;
  bubble.setPointerCapture(e.pointerId);
});
bubble.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
    drag.moved = true;
    bubble.classList.add('dragging');
  }
  placeBubble(e.clientX - drag.ox, e.clientY - drag.oy);
  if (S.chat.open) placeChat();
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.moved) { justDragged = true; store.set('bubble', S.bubble); }
  bubble.classList.remove('dragging');
  drag = null;
};
bubble.addEventListener('pointerup', endDrag);
bubble.addEventListener('pointercancel', endDrag);
bubble.addEventListener('click', () => {
  if (justDragged) { justDragged = false; return; }
  toggleChat();
});
bubble.addEventListener('keydown', e => {
  const step = e.shiftKey ? 64 : 16;
  const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (!move) return;
  e.preventDefault();
  const r = bubble.getBoundingClientRect();
  placeBubble(r.left + move[0], r.top + move[1], true);
  if (S.chat.open) placeChat();
});
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });
window.addEventListener('resize', () => {
  if (S.bubble) placeBubble(S.bubble.x, S.bubble.y);
  if (S.chat.open) placeChat();
});

applyTheme(S.theme);
const savedPos = store.get('bubble', null);
if (savedPos) placeBubble(savedPos.x, savedPos.y);
chat.hidden = true;
toggleChat(false);
render();
if (!location.hash) history.replaceState(null, '', '#painel');
